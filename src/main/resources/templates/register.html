<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — SmartLedger Pro</title>
    <link rel="stylesheet" th:href="@{/css/glassmorphic.css}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">
    <div class="glass-panel" style="width: 100%; max-width: 440px; border-color: rgba(255, 255, 255, 0.12); box-shadow: 0 24px 60px rgba(0,0,0,0.8), 0 0 30px -10px var(--emerald-glow);">
        <!-- Brand Header -->
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #10b981, #0ea5e9); display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); color: #fff; font-size: 1.5rem; margin-bottom: 0.75rem;">
                ⚡
            </div>
            <h1 style="font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; color: #f8fafc; margin: 0;">
                Create Account
            </h1>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem;">
                Join the SmartLedger Household Intelligence Suite
            </p>
        </div>

        <!-- Error Notification -->
        <div th:if="${error}" class="pill-badge badge-expired" style="width: 100%; justify-content: center; padding: 0.6rem; margin-bottom: 1.25rem; border-radius: var(--radius-sm);" th:text="${error}">
            Registration error occurred
        </div>

        <form method="post" action="/register">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="fullName" class="form-input" required placeholder="e.g. Rithish Kumar">
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-input" required placeholder="name@domain.com">
            </div>

            <div class="form-group">
                <label class="form-label">Password (Minimum 6 characters)</label>
                <input type="password" name="password" class="form-input" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-premium" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
                <span>Initialize Personal Ledger &rarr;</span>
            </button>
        </form>

        <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); text-align: center;">
            <p style="font-size: 0.825rem; color: var(--text-secondary);">
                Already have an account? <a href="/login" style="color: var(--cyan); text-decoration: none; font-weight: 600;">Sign in here</a>
            </p>
        </div>
    </div>
</body>
</html>
